<dialog id="dChat" aria-labelledby="chCfgT"><h2 id="chCfgT" style="margin-bottom:14px"></h2><div class="g">
<label class="w">Chave de API do OpenRouter<span class="row" style="flex-wrap:nowrap"><input id="chKey" type="password" autocomplete="off" spellcheck="false"><button class="b" id="chEye" type="button" data-chx="eye">Mostrar</button></span><span class="mu">Fica só na memória desta sessão, como nas Configurações de IA: não é gravada no navegador, no Drive nem em backups. A chamada é feita direto do navegador, então a chave não fica protegida contra inspeção por quem usa este navegador.</span></label>
<label class="w">Pesquisar modelos<input id="chMq" placeholder="Ex.: sonnet, opus, gpt…" autocomplete="off"></label>
<label class="w"><select id="chSel" size="6" aria-label="Lista de modelos"></select><span class="mu" id="chMc"></span></label>
<label class="w">Modelo (ID exato do OpenRouter)<input id="chMod" placeholder="provedor/modelo" autocomplete="off"></label></div>
<div id="chCfgMsg" role="status" style="margin-top:12px;min-height:22px;font-size:14px"></div>
<div class="row" style="margin-top:12px"><button class="b" data-chx="cfgmodels" type="button">Atualizar lista</button><button class="b" data-chx="cfguse" id="chUse" type="button" hidden>Usar a chave das Configurações de IA</button><button class="b" data-chx="cfgtest" type="button">Testar conexão</button><button class="b p" data-chx="cfgsave" type="button">Salvar</button><button class="b d" data-chx="cfgclear" type="button">Limpar chave</button><button class="b" data-chx="cfgclose" type="button" style="margin-left:auto">Fechar</button></div></dialog>
